[tool.poetry]
name = "codecraftai-sysman-linux-redhat"
description = "System management package for automating the maintenance of software configurations on Red Hat Linux systems."
version = "1.0.1"
authors = ["Code Craft AI"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux"
]
keywords = [
    "python",
    "automation",
    "system-management",
    "linux",
    "redhat",
    "maintenance"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-this-app = { version = "<2.0.0", source = "codecraftai" }
codecraftai-sysman-common = { version = "<2.0.0", source = "codecraftai" }
codecraftai-arcli = { version = "<2.0.0", source = "codecraftai" }
codecraftai-foundations = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
codecraftai-dataprofiles = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interop = { version = "<2.0.0", source = "codecraftai" }


[tool.poetry.group.dev.dependencies]
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }



[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
