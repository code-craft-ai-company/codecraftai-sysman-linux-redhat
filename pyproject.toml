[tool.poetry]
name = "automojo-sysman-linux-redhat"
description = "System management package for automating the maintenance of software configurations on Red Hat Linux systems."
version = "0.0.1"
authors = ["Automation Mojo"]
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux"
]
keywords = [
    "python",
    "automation",
    "system-management",
    "linux",
    "redhat",
    "maintenance"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
